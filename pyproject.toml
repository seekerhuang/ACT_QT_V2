[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "act-qt-v2"
version = "0.1.0"
description = "Source-file auditing helpers ported from ACT_QT_V3."
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
act-qt-audit = "act_qt_v2.cli.audit_data:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
